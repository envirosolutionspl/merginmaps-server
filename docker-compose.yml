version: "3.7"
networks:
  merginmaps:

services:
  db:
    image: postgres:16.9
    container_name: merginmaps-db
    restart: always
    networks:
      - merginmaps
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/Warsaw
    volumes:
      - ./mergin_db:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
  redis:
    image: redis:6.2.17
    container_name: merginmaps-redis
    restart: always
    networks:
      - merginmaps
  server-gunicorn:
    image: lutraconsulting/merginmaps-backend-es:2025.2.2
    container_name: merginmaps-server
    restart: always
    user: 901:999
    volumes:
      - ./projects:/data/:z
      - ./server/entrypoint.sh:/app/entrypoint.sh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .prod.env
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      - db
      - redis
    command: [ "gunicorn --config config.py application:application" ]
    networks:
      - merginmaps
  celery-beat:
    image: lutraconsulting/merginmaps-backend-es:2025.2.2
    container_name: celery-beat
    restart: always
    env_file:
      - .prod.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - TZ=Europe/Warsaw
    volumes:
      - ./server/entrypoint.sh:/app/entrypoint.sh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - server-gunicorn
    command: [ "celery -A application.celery beat --loglevel=info" ]
    networks:
      - merginmaps
  celery-worker:
    image: lutraconsulting/merginmaps-backend-es:2025.2.2
    container_name: celery-worker
    restart: always
    user: 901:999
    env_file:
      - .prod.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - TZ=Europe/Warsaw
    volumes:
      - ./projects:/data/:z
      - ./server/entrypoint.sh:/app/entrypoint.sh
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - server-gunicorn
      - celery-beat
    command: [ "celery -A application.celery worker --loglevel=info" ]
    networks:
      - merginmaps
  web:
    #image: lutraconsulting/merginmaps-frontend-es:2025.2.2
    container_name: merginmaps-web
    restart: always
    build:
      context: ./web-app
      dockerfile: Dockerfile
    depends_on:
      - server-gunicorn
    user: 101:999
    links:
      - db
    networks:
      - merginmaps
  proxy:
    image: nginxinc/nginx-unprivileged:1.27
    container_name: merginmaps-proxy
    restart: always
    environment:
      - TZ=Europe/Warsaw
    # run nginx as built-in user but with group mergin-family for files permissions
    user: 101:999
    ports:
      - "8080:8080"
    volumes:
      - ./projects:/data/:z  # map data dir to host
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - merginmaps
